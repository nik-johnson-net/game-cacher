[workspace]
members = ["game-cacher"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.98"
async-trait = "0.1.88"
axum = { version = "0.8.4", features = ["macros"] }
base64 = "0.22"
bytes = "1.9"
chacha20poly1305 = "0.10"
chrono = { version = "0.4.41", features = ["serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
clap = { version = "4.5.40", features = ["derive", "env"] }
dashmap = "6"
env_logger = "0.11"
flate2 = "1"
futures = "0.3"
hex = "0.4"
hickory-proto = "0.25"
hickory-resolver = { version = "0.25", features = ["tokio"] }
hostname = "0.4"
http = "1"
log = { version = "0.4.27", features = ["kv"] }
object_store = { version = "0.13.1", features = ["aws"] }
prometheus-client = "0.23"
rand = "0.9"
regex = "1"
rsa = "0.9"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10"
steam-vent = "0.5"
steam-vent-proto-common = "0.5.1"
steam-vent-proto-steam = "0.5.2"
subtle = "2.6"
tempfile = "3.12"
thiserror = "2"
tokio = { version = "1.45.1", features = ["rt-multi-thread", "net", "macros", "sync", "signal", "fs", "time", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
url = "2"
uuid = { version = "1.20.0", features = ["serde", "v4"] }
wiremock = "0.6"
zip = { version = "2", default-features = false, features = ["deflate"] }
