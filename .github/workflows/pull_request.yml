name: Pull Request

on:
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check-rust:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    # Keep in step with RUST_VERSION in docker/Dockerfile.
    - uses: dtolnay/rust-toolchain@1.100.0
      with:
        components: clippy rustfmt
    - name: Load Cache
      uses: actions/cache@v5
      with:
        key: target-${{ hashFiles('Cargo.lock') }}
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        restore-keys: |
          target-
    - name: Format Check
      run: cargo fmt --check
    - name: Clippy
      run: cargo clippy --all-targets --locked -- -D warnings
    - name: Run tests
      run: cargo test --locked

  check-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./game-cacher-ui

    steps:
    - uses: actions/checkout@v6
    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: 'npm'
        cache-dependency-path: game-cacher-ui/package-lock.json
    - name: npm ci
      run: npm ci
    - name: Type check
      run: npx tsc -b
    - name: eslint
      run: npx eslint .
    - name: Build game-cacher-ui
      run: npx vite build

  docker:
    runs-on: ubuntu-latest
    needs: [check-rust, check-ui]

    steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Build
      uses: docker/build-push-action@v7
      with:
        file: ./docker/Dockerfile
        push: false
        cache-from: type=gha
        cache-to: type=gha,mode=max
