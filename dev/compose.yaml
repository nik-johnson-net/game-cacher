# Local stack for development and end-to-end testing: game-cacher with S3 storage
# (SeaweedFS) and Vault secrets (dev mode).
#
#   docker build -f docker/Dockerfile -t game-cacher:dev .
#   docker compose -f dev/compose.yaml up -d
#   open http://127.0.0.1:8080   (password: admin)
#
# All services share the network namespace of `s3` (like a pod), so they reach
# each other on 127.0.0.1 and every published port is declared on `s3`. No
# bridge network is created: rootless/nested podman often can't set one up
# (CNI portmap fails on a read-only /proc/sys). The namespace uses slirp4netns
# by default; with real Docker run `GC_NETWORK_MODE=bridge docker compose ...`.
# dev/stack.sh starts the same stack as a podman pod without compose.
#
# Ports are remapped so they don't need root: DNS 5353, cache HTTP 8081, SNI 8443.
# Try it:  dig @127.0.0.1 -p 5353 lancache.steamcontent.com
name: game-cacher-dev

volumes:
  s3: {}

services:
  # SeaweedFS's S3 gateway with auth disabled (any credentials are accepted).
  # Its volume server defaults to :8080, which game-cacher's admin port uses.
  s3:
    image: docker.io/chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.port=9000 -volume.port=8090 -ip.bind=0.0.0.0
    network_mode: ${GC_NETWORK_MODE:-slirp4netns:allow_host_loopback=false}
    volumes: [s3:/data]
    ports:
      - "9000:9000"   # S3
      - "8200:8200"   # Vault
      - "5353:53/udp" # game-cacher DNS
      - "5353:53/tcp"
      - "8081:80"     # game-cacher cache
      - "8443:443"    # game-cacher SNI passthrough
      - "8080:8080"   # game-cacher UI/API

  vault:
    image: docker.io/hashicorp/vault:latest
    command: server -dev -dev-root-token-id=dev-root -dev-listen-address=0.0.0.0:8200
    network_mode: service:s3
    depends_on: [s3]
    cap_add: [IPC_LOCK]

  game-cacher:
    image: game-cacher:dev
    network_mode: service:s3
    depends_on: [s3, vault]
    restart: on-failure
    # Create the bucket once SeaweedFS is up, then start. (Not a separate
    # one-shot service: podman can't --require an exited container that shares
    # another container's network namespace.)
    entrypoint:
      - sh
      - -c
      - |
        until curl -s -o /dev/null -w '%{http_code}' -X PUT http://127.0.0.1:9000/game-cache | grep -qE '200|409'; do sleep 1; done
        exec /opt/game-cacher/bin/game-cacher
    environment:
      LOG: info
      GC_ADMIN_PASSWORD: admin
      GC_CACHE_IP: 127.0.0.1
      GC_UPSTREAM_DNS: 1.1.1.1,8.8.8.8
      GC_DNS_FORWARD: 1.1.1.1
      GC_STORAGE: s3
      GC_S3_BUCKET: game-cache
      GC_S3_ENDPOINT: http://127.0.0.1:9000
      GC_S3_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: any
      AWS_SECRET_ACCESS_KEY: any
      GC_SECRETS: vault
      GC_VAULT_ADDR: http://127.0.0.1:8200
      VAULT_TOKEN: dev-root
      GC_CACHE_MAX_SIZE: 50GiB
